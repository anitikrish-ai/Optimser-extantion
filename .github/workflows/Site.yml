name: Build and deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Unpack uploaded zip (only if one is present)
        run: |
          Z=$(ls *.zip 2>/dev/null | head -1)
          if [ -z "$Z" ]; then echo "No zip, skipping"; exit 0; fi
          mkdir /tmp/new && unzip -q "$Z" -d /tmp/new
          SRC=/tmp/new
          if [ "$(ls -A /tmp/new | wc -l)" = "1" ] && [ -d "/tmp/new/$(ls -A /tmp/new)" ]; then SRC="/tmp/new/$(ls -A /tmp/new)"; fi
          rm -rf "$SRC/.git" "$SRC/.github"
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a "$SRC"/. .
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Unpack refined optimiser"
          git push
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Put fresh zips next to the site
        run: |
          mkdir -p site/downloads
          (cd dist/chromium && zip -qr ../../site/downloads/uwpo-chromium.zip .)
          (cd dist/firefox && zip -qr ../../site/downloads/uwpo-firefox.zip .)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
