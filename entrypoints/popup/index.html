<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universal Performance Optimizer</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" fill="currentColor"/>
        </svg>
        <div class="brand-text">
          <span class="brand-title">Performance Optimizer</span>
          <span class="brand-subtitle">Universal Resource Control</span>
        </div>
      </div>
      <label class="switch" title="Master Optimization Switch">
        <input type="checkbox" id="master-toggle" checked>
        <span class="slider"></span>
      </label>
    </header>

    <!-- Domain Card -->
    <section class="domain-card">
      <div class="domain-info">
        <span class="domain-host" id="domain-hostname">Detecting site...</span>
        <span class="status-badge active" id="domain-status-badge">OPTIMIZED</span>
      </div>
      <div class="domain-actions">
        <button class="btn btn-secondary btn-sm" id="btn-toggle-allowlist" title="Exempt this domain from optimization">
          <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
          <span id="allowlist-btn-text">Allowlist Site</span>
        </button>
        <button class="btn btn-secondary btn-sm" id="btn-instant-reset" title="Instant Emergency Reset for this page">
          <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M2.5 2v6h6M21.5 22v-6h-6"/>
            <path d="M22 11.5A10 10 0 0 0 3.2 7.2M2 12.5a10 10 0 0 0 18.8 4.2"/>
          </svg>
          <span>Reset Page</span>
        </button>
      </div>
    </section>

    <!-- Optimization Mode Selector -->
    <section class="section-group">
      <div class="section-title-row">
        <span class="section-title">Optimization Mode</span>
        <span class="mode-badge" id="active-mode-indicator">BALANCED</span>
      </div>
      <div class="mode-grid">
        <button class="mode-btn active" data-mode="balanced">
          <span class="mode-name">Balanced</span>
          <span class="mode-desc">Safe default</span>
        </button>
        <button class="mode-btn" data-mode="performance">
          <span class="mode-name">Performance</span>
          <span class="mode-desc">Stronger safe</span>
        </button>
        <button class="mode-btn" data-mode="extreme">
          <span class="mode-name">Extreme Lite</span>
          <span class="mode-desc">Max responsiveness</span>
        </button>
        <button class="mode-btn" data-mode="adaptive_custom">
          <span class="mode-name">Adaptive</span>
          <span class="mode-desc">Hardware tuned</span>
        </button>
      </div>
    </section>

    <!-- Real Performance Telemetry (Genuine Measurements) -->
    <section class="section-group">
      <div class="section-title-row">
        <span class="section-title">Live Performance Telemetry</span>
        <span class="telemetry-notice">Verified metrics</span>
      </div>
      <div class="metrics-grid">
        <div class="metric-card">
          <span class="metric-label">Blocked Requests</span>
          <span class="metric-value" id="val-blocked-requests">0</span>
        </div>
        <div class="metric-card">
          <span class="metric-label">Estimated Saved Data</span>
          <span class="metric-value" id="val-saved-data">0 KB</span>
        </div>
        <div class="metric-card">
          <span class="metric-label">Page Ready</span>
          <span class="metric-value" id="val-dom-ready">-- ms</span>
        </div>
        <div class="metric-card">
          <span class="metric-label">JS Heap</span>
          <span class="metric-value" id="val-js-heap">--</span>
        </div>
      </div>
    </section>

    <!-- Quick Module Toggles -->
    <section class="section-group">
      <span class="section-title">Active Optimization Modules</span>
      <div class="module-chips">
        <label class="chip-label">
          <input type="checkbox" id="mod-scripts" checked>
          <span class="chip">Scripts</span>
        </label>
        <label class="chip-label">
          <input type="checkbox" id="mod-images" checked>
          <span class="chip">Images</span>
        </label>
        <label class="chip-label">
          <input type="checkbox" id="mod-videos" checked>
          <span class="chip">Videos</span>
        </label>
        <label class="chip-label">
          <input type="checkbox" id="mod-rendering" checked>
          <span class="chip">Rendering</span>
        </label>
        <label class="chip-label">
          <input type="checkbox" id="mod-cpu" checked>
          <span class="chip">CPU</span>
        </label>
        <label class="chip-label">
          <input type="checkbox" id="mod-dom" checked>
          <span class="chip">DOM</span>
        </label>
      </div>
    </section>

    <!-- Footer -->
    <footer class="popup-footer">
      <button class="btn btn-primary btn-full" id="btn-open-options">
        <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
        <span>Open Advanced Dashboard</span>
      </button>
      <div class="privacy-note">
        <svg class="icon-xs" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        <span>100% Local-First Privacy. Zero tracking.</span>
      </div>
    </footer>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
