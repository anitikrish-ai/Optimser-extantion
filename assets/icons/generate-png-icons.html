<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>UWPO - Local PNG Icon Generator</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #090d16;
      color: #f1f5f9;
      padding: 30px;
      max-width: 600px;
      margin: 0 auto;
    }
    h1 { font-size: 18px; margin-bottom: 8px; }
    p { font-size: 13px; color: #94a3b8; line-height: 1.5; margin-bottom: 20px; }
    .icon-grid { display: flex; gap: 16px; align-items: flex-end; margin-bottom: 24px; }
    .icon-box { text-align: center; }
    .icon-box span { display: block; font-size: 11px; color: #64748b; margin-top: 6px; }
    canvas { background: #0f172a; border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; }
    .btn {
      background: #10b981;
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    .btn:hover { background: #059669; }
  </style>
</head>
<body>
  <h1>UWPO PNG Icon Generator</h1>
  <p>This utility renders the vector icon into standard 16x16, 32x32, 48x48, and 128x128 PNG bitmaps entirely locally using the HTML5 Canvas API without external tools.</p>

  <div class="icon-grid">
    <div class="icon-box">
      <canvas id="c16" width="16" height="16"></canvas>
      <span>16x16</span>
    </div>
    <div class="icon-box">
      <canvas id="c32" width="32" height="32"></canvas>
      <span>32x32</span>
    </div>
    <div class="icon-box">
      <canvas id="c48" width="48" height="48"></canvas>
      <span>48x48</span>
    </div>
    <div class="icon-box">
      <canvas id="c128" width="128" height="128"></canvas>
      <span>128x128</span>
    </div>
  </div>

  <button class="btn" id="btn-download">Download PNG Icons</button>

  <script>
    const sizes = [16, 32, 48, 128];

    function drawIcon(ctx, size) {
      const scale = size / 128;
      ctx.save();
      ctx.scale(scale, scale);

      // Background
      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.roundRect(0, 0, 128, 128, 28);
      ctx.fill();

      // Border
      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(4, 4, 120, 120, 24);
      ctx.stroke();

      // Lightning Bolt
      ctx.fillStyle = '#10b981';
      ctx.strokeStyle = '#059669';
      ctx.lineWidth = 3;
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(72, 16);
      ctx.lineTo(32, 72);
      ctx.lineTo(64, 72);
      ctx.lineTo(56, 112);
      ctx.lineTo(96, 56);
      ctx.lineTo(64, 56);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Accent dots
      ctx.fillStyle = '#38bdf8';
      ctx.beginPath();
      ctx.arc(86, 40, 4, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.arc(98, 54, 3, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    sizes.forEach(size => {
      const canvas = document.getElementById('c' + size);
      const ctx = canvas.getContext('2d');
      drawIcon(ctx, size);
    });

    document.getElementById('btn-download').addEventListener('click', () => {
      sizes.forEach(size => {
        const canvas = document.getElementById('c' + size);
        const a = document.createElement('a');
        a.href = canvas.toDataURL('image/png');
        a.download = `icon-${size}.png`;
        a.click();
      });
    });
  </script>
</body>
</html>
